name: CDDA WebAssembly Build  
  
on:  
  push:  
    tags:  
      - '0.*'  
      - '0.*-build*'  
  workflow_dispatch:  
    inputs:  
      release_tag:  
        description: 'CDDA release tag to build (e.g., 0.I for stable Ito)'  
        required: true  
        default: '0.I'  
  
# Lets the build push the finished site to the gh-pages branch.  
permissions:  
  contents: write  
  
env:  
  EMSCRIPTEN_VERSION: '6.0.12'  
  CDDA_REPO: 'CleverRaven/cataclysm-dda'  
  BUILD_TYPE: 'Release'  
  BUILD_TILES: 'true'  
  BUILD_SOUND: 'true'  
  BUILD_LOCALIZATION: 'false'  
  
jobs:  
  build:  
    name: Build CDDA WebAssembly  
    runs-on: ubuntu-latest  
  
    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v4  
        with:  
          fetch-depth: 0  
  
      - name: Get release tag  
        id: get_tag  
        run: |  
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then  
            if [ "${{ github.event.inputs.release_tag }}" = "latest" ]; then  
              echo "Fetching latest stable Ito release tag..."  
              TAG=$(git ls-remote --tags https://github.com/${{ env.CDDA_REPO }}.git | grep -E 'refs/tags/0\.[A-Z]$' | sed 's#.*/##' | sort -V | tail -n1)  
              echo "tag=$TAG" >> $GITHUB_OUTPUT  
            else  
              echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT  
            fi  
          else  
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT  
          fi  
          echo "Building CDDA release: ${{ steps.get_tag.outputs.tag }}"  
  
      # Install the ccache program itself (the "photocopy machine").  
      - name: Install ccache  
        run: |  
          sudo apt-get update  
          sudo apt-get install -y ccache  
          ccache --version  
  
      - name: Install Emscripten (custom fork)
        run: |
          cd $HOME
          rm -rf emsdk
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk

          # Overwrite the upstream emscripten checkout with our fork so emsdk uses
          # the ports in that fork (contains SDL3_Mixer & SDL3_Image).
          rm -rf upstream/emscripten
          git clone --depth 1 --branch main https://github.com/AndrewL97/emscripten.git upstream/emscripten

          # Install and activate the requested SDK version (6.0.12)
          ./emsdk install ${{ env.EMSCRIPTEN_VERSION }}
          ./emsdk activate ${{ env.EMSCRIPTEN_VERSION }}

          # Install ccache wrapper package used by the build
          ./emsdk install ccache-git-emscripten-64bit

          # Load emsdk env for verification
          source ./emsdk_env.sh

          echo "=== smoke checks: upstream/emscripten and ports ==="
          echo "emscripten tree HEAD:"
          if [ -f ./upstream/emscripten/.git/HEAD ]; then
            sed -n '1,2p' ./upstream/emscripten/.git/HEAD || true
          else
            echo "(no .git/HEAD found; upstream may be a downloaded archive)"
          fi
          echo "Listing upstream/emscripten/ports (first 200 lines):"
          ls -la ./upstream/emscripten/ports || true
          # Look specifically for our ports
          if ls ./upstream/emscripten/ports | grep -E 'SDL3_Mixer|SDL3_Image' >/dev/null 2>&1; then
            echo "Found SDL3_Mixer / SDL3_Image in upstream/emscripten/ports"
          else
            echo "WARNING: SDL3_Mixer / SDL3_Image not found in upstream/emscripten/ports"
            echo "This may mean emsdk installed a prebuilt SDK that ignores the local upstream copy."
          fi

          # Verify emcc works
          emcc --version
  
      # Save/restore ccache's cache box between runs. This is what makes the  
      # SECOND and later builds fast (first build is still full-length). 
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.ref_name }}-${{ env.EMSCRIPTEN_VERSION }}-${{ runner.os }}-${{ hashFiles('**/scripts/**') }}
          restore-keys: |
            ccache-${{ github.ref_name }}-${{ env.EMSCRIPTEN_VERSION }}-
            ccache-${{ github.ref_name }}-
            ccache-
 

  
      - name: Cache build artifacts  
        uses: actions/cache@v4  
        with:  
          path: |  
            build-cache  
            cdda-source  
          key: cdda-build-${{ steps.get_tag.outputs.tag }}-${{ env.BUILD_TYPE }}-${{ env.BUILD_TILES }}-${{ env.BUILD_SOUND }}  
          restore-keys: |  
            cdda-build-${{ steps.get_tag.outputs.tag }}-  
  
      - name: Fetch CDDA release  
        run: |  
          chmod +x scripts/fetch_release.sh  
          ./scripts/fetch_release.sh "${{ steps.get_tag.outputs.tag }}" 
          
      - name: Build CDDA WebAssembly  
        env:  
          CCACHE: 1  
          CCACHE_DIR: /home/runner/.ccache  
          CCACHE_MAXSIZE: 5G  
        run: |  
          # Ensure emsdk env is active in this step (safety)
          if [ -f $HOME/emsdk/emsdk_env.sh ]; then
            source $HOME/emsdk/emsdk_env.sh
          fi
          # show ccache stats pre-build
          ccache --zero-stats || true

          chmod +x scripts/build_web.sh
          ./scripts/build_web.sh

          echo "ccache stats after build:"
          ccache --show-stats || true
  
      - name: Package web build  
        run: |  
          export BUILD_VERSION="${{ steps.get_tag.outputs.tag }}"  
          export BUILD_TYPE="${{ env.BUILD_TYPE }}"  
          export BUILD_TILES="${{ env.BUILD_TILES }}"  
          export BUILD_SOUND="${{ env.BUILD_SOUND }}"  
          export BUILD_LOCALIZATION="${{ env.BUILD_LOCALIZATION }}"  
          export EMSCRIPTEN_VERSION="${{ env.EMSCRIPTEN_VERSION }}"  
          chmod +x scripts/package_web.sh  
          ./scripts/package_web.sh  
  
      - name: Upload build artifacts  
        uses: actions/upload-artifact@v4  
        with:  
          name: cdda-web-${{ steps.get_tag.outputs.tag }}  
          path: web-output/  
          retention-days: 30  
  
      - name: Deploy to GitHub Pages  
        uses: peaceiris/actions-gh-pages@v3  
        with:  
          github_token: ${{ secrets.GITHUB_TOKEN }}  
          publish_dir: ./web-output  
          publish_branch: gh-pages  
          force_orphan: true  
          user_name: 'github-actions[bot]'  
          user_email: 'github-actions[bot]@users.noreply.github.com'  
          commit_message: 'Deploy CDDA Web ${{ steps.get_tag.outputs.tag }}'  
  
      - name: Create deployment summary  
        run: |  
          echo "## CDDA WebAssembly Build Complete" >> $GITHUB_STEP_SUMMARY  
          echo "" >> $GITHUB_STEP_SUMMARY  
          echo "**Release Tag:** \`${{ steps.get_tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY  
          echo "**Build Type:** ${{ env.BUILD_TYPE }}" >> $GITHUB_STEP_SUMMARY  
          echo "**Tiles:** ${{ env.BUILD_TILES }}" >> $GITHUB_STEP_SUMMARY  
          echo "**Sound:** ${{ env.BUILD_SOUND }}" >> $GITHUB_STEP_SUMMARY  
          echo "**Localization:** ${{ env.BUILD_LOCALIZATION }}" >> $GITHUB_STEP_SUMMARY  
          echo "**Emscripten:** ${{ env.EMSCRIPTEN_VERSION }}" >> $GITHUB_STEP_SUMMARY  
          echo "" >> $GITHUB_STEP_SUMMARY  
          echo "### Build Artifacts" >> $GITHUB_STEP_SUMMARY  
          echo "- cdda-web-${{ steps.get_tag.outputs.tag }} (available for download)" >> $GITHUB_STEP_SUMMARY  
          echo "" >> $GITHUB_STEP_SUMMARY  
          echo "### Deployment" >> $GITHUB_STEP_SUMMARY  
          echo "Deployed to \`gh-pages\` branch - available at GitHub Pages" >> $GITHUB_STEP_SUMMARY
